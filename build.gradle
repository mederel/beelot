plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '1.1.13'
}

group = 'com.beelot'
version = '0.0.1-SNAPSHOT'
description = 'Online Belote game'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Bot arena: `./gradlew botArena` plays bots against each other on seeded deals.
// Options: -Pfirst=current -Psecond=random -Pdeals=10000 -Pseed=1 -Pvariant=both
tasks.register('botArena', JavaExec) {
    group = 'verification'
    description = 'Measures bot strength by playing two bots against each other on seeded deals.'
    classpath = sourceSets.main.output + configurations.runtimeClasspath
    mainClass = 'fr.beelot.game.arena.BotArenaMain'
    def option = { name, fallback -> providers.gradleProperty(name).getOrElse(fallback) }
    args '--first', option('first', 'current'), '--second', option('second', 'random'),
            '--deals', option('deals', '10000'), '--seed', option('seed', '1'),
            '--variant', option('variant', 'both'),
            '--report', layout.buildDirectory.file('reports/bot-arena/report.txt').get().asFile.path
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// Native image: `./gradlew nativeCompile` builds build/native/nativeCompile/beelot.
// Gradle downloads a GraalVM toolchain if none is installed (see settings.gradle).
graalvmNative {
    binaries {
        main {
            imageName = 'beelot'
            javaLauncher.set(javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(25)
                vendor = JvmVendorSpec.GRAAL_VM
            })
        }
        test {
            javaLauncher.set(javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(25)
                vendor = JvmVendorSpec.GRAAL_VM
            })
        }
    }
}
