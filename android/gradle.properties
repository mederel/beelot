org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
# The website the app shows and is verified against (US-127); override with -PbeeloHost=example.org.
beeloHost=beelot.fr
# The application id; the Digital Asset Links file of the site names the same package (BEELOT_ANDROID_PACKAGE).
beeloApplicationId=fr.beelot.app
