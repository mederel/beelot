<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150">
  <defs>
    <clipPath id="body"><ellipse cx="50" cy="66" rx="26" ry="22"/></clipPath>
    <path id="spade" d="M0-8C10 2 8 9 3 8 2 8 1 7 1 7L3 14H-3L-1 7C-1 7-2 8-3 8-8 9-10 2 0-8Z"/>
    <g id="word" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M12 10V80"/><circle cx="36" cy="60" r="17"/>
      <path d="M70 60H106A18 18 0 1 0 101 73"/>
      <path d="M124 60H160A18 18 0 1 0 155 73"/>
      <path d="M180 10V80"/>
      <circle cx="218" cy="60" r="18"/>
      <path d="M256 22V66Q256 80 268 80H274M242 44H270"/>
    </g>
  </defs>
  <!-- mark -->
  <g transform="translate(6 8) rotate(-8 50 70)">
    <rect x="15" y="12" width="72" height="100" rx="10" fill="#111" transform="translate(6 6)"/>
    <rect x="15" y="12" width="72" height="100" rx="10" fill="#fffdf2" stroke="#111" stroke-width="5"/>
    <use href="#spade" transform="translate(28 30) scale(.8)" fill="#1b1b2f"/>
    <use href="#spade" transform="translate(74 94) rotate(180) scale(.8)" fill="#1b1b2f"/>
    <!-- wings -->
    <ellipse cy="56" rx="8" ry="13" transform="rotate(-50 30 56)" cx="30" fill="#bdf1ff" stroke="#111" stroke-width="3.5"/>
    <ellipse cx="70" cy="56" rx="8" ry="13" transform="rotate(50 70 56)" fill="#bdf1ff" stroke="#111" stroke-width="3.5"/>
    <!-- antennae -->
    <path d="M43 48Q38 36 31 32M57 48Q62 36 69 32" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="31" cy="32" r="3.5" fill="#ff647c" stroke="#111" stroke-width="2.5"/>
    <circle cx="69" cy="32" r="3.5" fill="#ff647c" stroke="#111" stroke-width="2.5"/>
    <!-- stinger -->
    <path d="M44 87L50 98L56 87Z" fill="#111" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="50" cy="66" rx="26" ry="22" fill="#ffd23f"/>
    <g clip-path="url(#body)" fill="#111"><rect x="20" y="74" width="60" height="6"/><rect x="20" y="84" width="60" height="6"/></g>
    <ellipse cx="50" cy="66" rx="26" ry="22" fill="none" stroke="#111" stroke-width="4"/>
    <!-- face -->
    <circle cx="41" cy="60" r="6" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="59" cy="60" r="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <circle cx="42.5" cy="61" r="2.8" fill="#111"/><circle cx="57.5" cy="61" r="2.8" fill="#111"/>
    <path d="M43 69Q50 76 57 69" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <circle cx="36" cy="69" r="3" fill="#ff7eb6" opacity=".8"/><circle cx="64" cy="69" r="3" fill="#ff7eb6" opacity=".8"/>
  </g>
  <!-- wordmark -->
  <g transform="translate(128 34)">
    <use href="#word" stroke="#111" stroke-width="21" transform="translate(5 5)"/>
    <use href="#word" stroke="#111" stroke-width="21"/>
    <use href="#word" stroke="#ffd23f" stroke-width="12"/>
    <!-- highlights -->
    <g stroke="#fff6c9" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M12 22V40"/><path d="M180 22V38"/></g>
