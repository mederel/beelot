[package]
name = "beelot-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"
description = "Web server of a Belote card game: tables, accounts and history, serving the frontend."

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
beelot-game = { path = "../beelot-game" }
dashmap = "6"
dotenvy = "0.15"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "uuid", "time", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "request-id", "set-header", "limit", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
webauthn-rs-proto = "0.5"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
webauthn-authenticator-rs = { version = "0.6", features = ["softpasskey"] }
testcontainers-modules = { version = "0.15", features = ["mariadb"] }
tokio = { version = "1", features = ["test-util"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }

# The Debian package: `cargo deb` (see .github/scripts/build-deb.sh and packaging/debian/).
[package.metadata.deb]
name = "beelot"
maintainer = "Beelot <mederel@users.noreply.github.com>"
copyright = "Beelot contributors"
section = "misc"
priority = "optional"
extended-description = "A Belote card game: play against bots, with friends at a private table or on one device. This package runs its web server as a systemd service; it needs a MariaDB database, which it does not create."
depends = "$auto, adduser"
recommends = "mariadb-server"
changelog = "../../target/debian-changelog"
maintainer-scripts = "../../packaging/debian"
conf-files = ["/etc/beelot/beelot.env"]
assets = [
    ["target/release/beelot-server", "usr/bin/", "755"],
    ["static/**/*", "usr/share/beelot/static/", "644"],
    ["../../packaging/debian/beelot.env", "etc/beelot/beelot.env", "640"],
    ["../../README.md", "usr/share/doc/beelot/README.md", "644"],
]

[package.metadata.deb.systemd-units]
unit-scripts = "../../packaging/debian"
enable = true
start = false
restart-after-upgrade = true
