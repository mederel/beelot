[package]
name = "beelot-table"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"
description = "The rules of a Beelot table: seats, lobby, auction and card play, bots' turns, undo and rematch, with no I/O."

[dependencies]
beelot-game = { path = "../beelot-game" }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
