# Local MariaDB for development: `docker compose up -d`. The app's defaults point at it.
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: beelot
      MARIADB_USER: beelot
      MARIADB_PASSWORD: beelot
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - beelot-mariadb:/var/lib/mysql

volumes:
  beelot-mariadb:
