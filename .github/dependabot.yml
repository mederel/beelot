version: 2

# Dependency updates, weekly. Minor and patch updates are merged automatically once CI passes
# (.github/workflows/dependabot-automerge.yml); major updates wait for a person.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/packaging/container"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      android-minor-and-patch:
        update-types: [minor, patch]
