name: pr-title

# Pull requests are squash-merged, so the title becomes the commit on main and
# decides the release version (see .github/scripts/next-version.sh).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # The merge queue needs the required check to report. The title was checked on the pull request; a queued run has no
  # title to read, so its only step is skipped and the job passes.
  merge_group:

permissions: {}

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|ci|chore|refactor|test|perf|build|style|revert)(\([^)]+\))?!?: .+'
          if ! grep -qE "$pattern" <<< "$TITLE"; then
            echo "::error title=PR title::\"$TITLE\" is not a Conventional Commit: type(scope)?: summary, with type one of feat, fix, docs, ci, chore, refactor, test, perf, build, style, revert."
            exit 1
          fi
