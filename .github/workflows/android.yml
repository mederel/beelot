name: android

# Builds the Android app (US-127) with what the runner has: Java, Gradle and the Android SDK. android/build.sh
# has the runner's Gradle generate a wrapper, so the build does not depend on the runner's Gradle version.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the debug app
        run: android/build.sh assembleDebug
      - name: Build the release bundle (unsigned, no secret needed)
        run: android/build.sh bundleRelease -PbeeloVersionName=0.0.0-ci -PbeeloVersionCode=1
