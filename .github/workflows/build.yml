name: build

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each queued pull request on top of main and needs the same checks to report.
  merge_group:

permissions:
  contents: read

jobs:
  # Tells whether anything besides documentation changed. The check job is
  # skipped otherwise; a skipped job still satisfies the required check, which
  # paths-ignore would leave pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      gentoo: ${{ steps.filter.outputs.gentoo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        # Documentation is Markdown and anything under docs/. When the diff
        # cannot be computed, or is empty, the code counts as changed.
        run: |
          if git diff --name-only "$BASE...$GITHUB_SHA" > changed.txt \
            && [ -s changed.txt ] \
            && ! grep -qvE '(^docs/|\.md$)' changed.txt; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          # The Gentoo ebuild takes long to try: only when it, its scripts or the crates it lists changed.
          if grep -qE '^(packaging/gentoo/|\.github/scripts/(prepare-ebuild\.sh|gentoo-ebuild-data\.py|test-gentoo-ebuild\.sh)|Cargo\.lock$)' changed.txt; then
            echo "gentoo=true" >> "$GITHUB_OUTPUT"
          else
            echo "gentoo=false" >> "$GITHUB_OUTPUT"
          fi
          cat changed.txt

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Runs the workspace's tests with coverage instrumentation; llvm-cov skips
      # doctests, so they run on their own.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - run: cargo test --workspace --doc
      - name: Summarise coverage
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          .github/scripts/coverage-summary.sh coverage.json > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage.md
      # A pull request from a fork gets a read-only token and cannot comment.
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: coverage.md

  # Builds the Debian package and the RPM and checks them, on amd64 and on arm64 (US-137), and tests the
  # repository scripts, on every pull request. It signs and deploys nothing and uses no secret.
  package-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, deb: amd64, rpm: x86_64 }
          - { os: ubuntu-24.04-arm, deb: arm64, rpm: aarch64 }
    # Pinned: the package's glibc dependency follows the image it is built on.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deb@3.8.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev apt-utils gnupg lintian
      - run: .github/scripts/build-deb.sh 0.0.0-ci
      - run: .github/scripts/check-deb.sh dist/beelot_0.0.0-ci_${{ matrix.deb }}.deb 0.0.0-ci
      # The binary must run on Debian stable (glibc 2.41 in trixie): it fails when the image it is built on is newer.
      - name: Check the glibc the binary needs
        run: .github/scripts/check-glibc.sh target/release/beelot-server 2.41
      # Warnings are listed, only errors fail.
      - run: lintian --fail-on error dist/beelot_0.0.0-ci_${{ matrix.deb }}.deb
      # debian:stable follows the release that is stable now, so a new stable release is tried as soon as it ships.
      - name: Install it on Debian stable
        run: docker run --rm -v "$PWD":/w -w /w debian:stable .github/scripts/test-deb-install.sh dist/beelot_0.0.0-ci_${{ matrix.deb }}.deb
      # An early warning for the next Debian release: a failure here is shown but does not fail the job.
      - name: Install it on Debian testing
        if: matrix.deb == 'amd64'
        continue-on-error: true
        run: docker run --rm -v "$PWD":/w -w /w debian:testing .github/scripts/test-deb-install.sh dist/beelot_0.0.0-ci_${{ matrix.deb }}.deb
      # The RPM packs the release binary just built; Fedora's tools run in a container (an RPM version has no dash).
      - name: Build the RPM
        run: docker run --rm -v "$PWD":/w -w /w fedora:42 .github/scripts/build-rpm.sh 0.0.0
      - name: Check the RPM
        run: docker run --rm -v "$PWD":/w -w /w fedora:42 .github/scripts/check-rpm.sh dist/beelot-0.0.0-1.${{ matrix.rpm }}.rpm 0.0.0
      - name: Install it on Fedora
        run: docker run --rm -v "$PWD":/w -w /w fedora:42 .github/scripts/test-rpm-install.sh dist/beelot-0.0.0-1.${{ matrix.rpm }}.rpm
      # The container image is built from the same release binary and tried against a real MariaDB container.
      - name: Build the container image
        run: |
          .github/scripts/stage-container.sh target/release/beelot-server crates/beelot-server/static target/container
          docker build --build-arg VERSION=0.0.0-ci -t beelot:ci target/container
      - name: Run the container image
        run: .github/scripts/test-container.sh beelot:ci
      - name: Test the site page
        if: matrix.deb == 'amd64'
        run: node --test crates/beelot-server/frontend-tests/site.test.cjs
      - name: Test the dnf repository script
        if: matrix.deb == 'amd64'
        run: docker run --rm -v "$PWD":/w -w /w fedora:42 .github/scripts/test-rpm-repo.sh
      - name: Test the apt repository script
        if: matrix.deb == 'amd64'
        run: |
          docker run --rm -v "$PWD":/w -w /w debian:trixie bash -c \
            'apt-get update -qq && apt-get install -y -qq dpkg-dev apt-utils gnupg > /dev/null && .github/scripts/test-apt-repo.sh'

  # Builds the Arch Linux package from source in a clean Arch container, installs it and checks it (US-136) on every
  # pull request. It publishes nothing and uses no secret.
  # The one stable name of packaging for the ruleset to require. A matrix job is named after its legs when it runs and
  # plain `package` when it is skipped, so requiring the legs blocks every documentation-only pull request for ever; this
  # job always runs, and fails if a leg failed or was cancelled.
  package:
    needs: package-build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every leg built, or none was needed
        env:
          RESULT: ${{ needs.package-build.result }}
        run: |
          echo "package-build: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]

  arch:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, install and check the package
        run: docker run --rm -v "$PWD":/w -w /w archlinux:latest .github/scripts/test-arch-package.sh

  # Tries the Gentoo ebuild in a stage3 container (US-138): pkgcheck, then the compile and install phases and a merge. It
  # compiles the server on top of syncing Portage, so it runs only when the ebuild, its scripts or Cargo.lock change. It
  # publishes nothing and uses no secret.
  gentoo:
    needs: changes
    if: needs.changes.outputs.gentoo == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Try the ebuild
        run: docker run --rm -v "$PWD":/w -w /w gentoo/stage3:latest .github/scripts/test-gentoo-ebuild.sh

  # On main, publishes what the checks accepted: the release build of the
  # server with its frontend, as a workflow artifact and a GitHub release.
  # Documentation-only pushes skip the checks and so release nothing.
  release:
    needs: [changes, check, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.result == 'success' && needs.package.result == 'success'
    # Pinned: the package's glibc dependency follows the image it is built on.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Two releases at once would compute the same version.
    concurrency:
      group: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.version != ''
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - if: steps.version.outputs.version != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.version.outputs.version != ''
        env:
          BEELOT_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --locked -p beelot-server
      - if: steps.version.outputs.version != ''
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deb@3.8.0
      - name: Debian package
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev
          .github/scripts/build-deb.sh "$VERSION"
          .github/scripts/check-deb.sh "dist/beelot_${VERSION}_amd64.deb" "$VERSION"
      - name: RPM package
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm -v "$PWD":/w -w /w fedora:42 .github/scripts/build-rpm.sh "$VERSION"
          docker run --rm -v "$PWD":/w -w /w fedora:42 .github/scripts/check-rpm.sh "dist/beelot-${VERSION}-1.x86_64.rpm" "$VERSION"
      - name: Package
        if: steps.version.outputs.version != ''
        env:
          NAME: beelot-${{ steps.version.outputs.version }}-linux-x86_64
        run: |
          mkdir -p "dist/$NAME"
          cp target/release/beelot-server README.md "dist/$NAME/"
          cp -r crates/beelot-server/static "dist/$NAME/static"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
      - if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beelot-${{ steps.version.outputs.version }}
          path: |
            beelot-*.tar.gz
            dist/beelot_*.deb
            dist/beelot-*.rpm
      - name: Release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" beelot-*.tar.gz "dist/beelot_${VERSION}_amd64.deb" "dist/beelot-${VERSION}-1.x86_64.rpm" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

  # Publishes the container image of the version just released to the GitHub container registry (US-135): ghcr.io/mederel/beelot
  # tagged with the version and latest, built from the release's own binary and tried before it is pushed. The first push
  # creates a private package: make it public once, in the package's settings (see the README).
  container:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image from the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release download "v$VERSION" --pattern 'beelot-*-linux-x86_64.tar.gz' --dir release
          tar -xzf release/beelot-*-linux-x86_64.tar.gz -C release
          dir=$(ls -d release/beelot-*-linux-x86_64)
          .github/scripts/stage-container.sh "$dir/beelot-server" "$dir/static" release/container
          docker build --build-arg VERSION="$VERSION" -t "ghcr.io/mederel/beelot:$VERSION-amd64" release/container
      - name: Run the image
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: .github/scripts/test-container.sh "ghcr.io/mederel/beelot:$VERSION-amd64"
      # One tag per architecture; `container-manifest` joins them under `<version>` and `latest` (US-144).
      - name: Push the image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/mederel/beelot:$VERSION-amd64"

  # Joins the per-architecture images into the multi-architecture `<version>` and `latest` tags (US-144), so `docker pull`
  # takes the machine's own. It runs when the amd64 image was pushed, with the arm64 one if its job succeeded.
  container-manifest:
    needs: [release, container, release-arm64]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.container.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          ARM64: ${{ needs.release-arm64.result }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          images=("ghcr.io/mederel/beelot:$VERSION-amd64")
          if [ "$ARM64" = success ]; then images+=("ghcr.io/mederel/beelot:$VERSION-arm64"); fi
          docker buildx imagetools create -t "ghcr.io/mederel/beelot:$VERSION" -t ghcr.io/mederel/beelot:latest "${images[@]}"

  # Builds the arm64 Debian package and RPM of the version just released and adds them to the GitHub release
  # (US-137). The release stays published whatever this job does; the apt and dnf repositories take the arm64
  # packages once they are attached, and a failed run is repaired by the next release.
  release-arm64:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.version != ''
    # Pinned: the package's glibc dependency follows the image it is built on.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      # The commit the release was built from, not whatever main has become since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deb@3.8.0
      - name: Build the server
        env:
          BEELOT_VERSION: ${{ env.VERSION }}
        run: cargo build --release --locked -p beelot-server
      - name: Debian package
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev
          .github/scripts/build-deb.sh "$VERSION"
          .github/scripts/check-deb.sh "dist/beelot_${VERSION}_arm64.deb" "$VERSION"
      - name: RPM package
        run: |
          docker run --rm -v "$PWD":/w -w /w fedora:42 .github/scripts/build-rpm.sh "$VERSION"
          docker run --rm -v "$PWD":/w -w /w fedora:42 .github/scripts/check-rpm.sh "dist/beelot-${VERSION}-1.aarch64.rpm" "$VERSION"
      - name: Add the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "dist/beelot_${VERSION}_arm64.deb" "dist/beelot-${VERSION}-1.aarch64.rpm"
      # The arm64 image is built from the binary above, tried against MariaDB, and pushed under its own tag, after the
      # packages are attached so a failure here loses none of them (US-144).
      - name: Build the container image
        run: |
          .github/scripts/stage-container.sh target/release/beelot-server crates/beelot-server/static target/container
          docker build --build-arg VERSION="$VERSION" -t "ghcr.io/mederel/beelot:$VERSION-arm64" target/container
      - name: Run the container image
        run: .github/scripts/test-container.sh "ghcr.io/mederel/beelot:$VERSION-arm64"
      - name: Push the container image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/mederel/beelot:$VERSION-arm64"

  # Builds the Gentoo overlay of the version just released, with its ebuild and Manifest, and adds it to the GitHub release
  # (US-143). The Manifest is made from the tag's own tarball. The release stays published whatever this job does, and a
  # failed run is repaired by the next release.
  gentoo-overlay:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the overlay
        run: docker run --rm -v "$PWD":/w -w /w gentoo/stage3:latest .github/scripts/build-gentoo-overlay.sh "$VERSION" dist
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "dist/beelot-gentoo-overlay-$VERSION.tar.gz"

  # Builds the Android release bundle (AAB) of the version just released and adds it to the GitHub release
  # (US-128). It is signed with the upload key from the secrets ANDROID_UPLOAD_KEYSTORE_BASE64,
  # ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS and ANDROID_UPLOAD_KEY_PASSWORD (see the README);
  # without them the bundle is built unsigned and named so, and Play will not take it. The release stays published
  # whatever this job does, and the job needs no secret to build.
  android-release:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the bundle
        env:
          VERSION: ${{ needs.release.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          BEELOT_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          BEELOT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          BEELOT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          name="beelot-$VERSION-unsigned.aab"
          if [ -n "$KEYSTORE_BASE64" ]; then
            export BEELOT_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$BEELOT_UPLOAD_KEYSTORE"
            name="beelot-$VERSION.aab"
          else
            echo "::warning::No upload key in the secrets: the bundle is built unsigned."
          fi
          android/build.sh bundleRelease "-PbeeloVersionName=$VERSION" "-PbeeloVersionCode=$(.github/scripts/android-version.sh "$VERSION")"
          cp android/app/build/outputs/bundle/release/app-release.aab "$name"
          echo "BUNDLE=$name" >> "$GITHUB_ENV"
      - name: Add the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v$VERSION" "$BUNDLE"

  # Rebuilds the signed apt repository from every release's package and deploys it
  # to GitHub Pages. It needs the secrets APT_GPG_PRIVATE_KEY and
  # APT_GPG_PASSPHRASE and Pages set to deploy from GitHub Actions (see the
  # README); without them the job fails and the release is still published.
  apt-repo:
    needs: [release, release-arm64]
    # Even when the arm64 job failed: the repository is then published with what the release holds.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The repository is rebuilt from every release: two runs must not overlap.
    concurrency:
      group: apt-repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Until the secrets exist the job is skipped with a warning, so main stays green.
      - name: Check the signing secrets
        id: secrets
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          for name in APT_GPG_PRIVATE_KEY APT_GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::warning::The secret $name is not set, so the apt repository is not published: see 'Publishing the apt repository' in the README."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev apt-utils gnupg createrepo-c
      - name: Collect every release's package
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir debs
          for tag in $(gh release list --limit 1000 --json tagName --jq '.[].tagName'); do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -q '^beelot_.*_\(amd64\|arm64\)\.deb$'; then
              gh release download "$tag" --pattern 'beelot_*_amd64.deb' --pattern 'beelot_*_arm64.deb' --dir debs
            fi
          done
          ls debs
          mkdir rpms
          for tag in $(gh release list --limit 1000 --json tagName --jq '.[].tagName'); do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -q '^beelot-.*\.\(x86_64\|aarch64\)\.rpm$'; then
              gh release download "$tag" --pattern 'beelot-*.x86_64.rpm' --pattern 'beelot-*.aarch64.rpm' --dir rpms
            fi
          done
          ls rpms
      - name: Import the signing key
        if: steps.secrets.outputs.ready == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME=$(mktemp -d)
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          export GNUPGHOME
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          echo "KEY_ID=$key" >> "$GITHUB_ENV"
      - name: Build the repository
        if: steps.secrets.outputs.ready == 'true'
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          # The hosted game the page links to; the repository variable may be left unset.
          BEELOT_PLAY_URL: ${{ vars.BEELOT_PLAY_URL }}
        run: |
          .github/scripts/build-apt-repo.sh debs site "$KEY_ID"
          .github/scripts/build-rpm-repo.sh rpms site "$KEY_ID"
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Remove the signing key
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi
