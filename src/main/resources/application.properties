# Bound resource use so a flood of connections or requests cannot exhaust the server.
server.tomcat.threads.max=100
server.tomcat.max-connections=2000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10s
server.tomcat.max-http-form-post-size=8KB
server.tomcat.max-swallow-size=64KB
server.max-http-request-header-size=8KB
server.shutdown=graceful

# Application limits (see RequestRateLimitFilter, BotGameService, PrivateTableService).
beelot.security.max-request-bytes=4096
beelot.security.rate-limit.requests-per-window=300
beelot.security.rate-limit.creations-per-window=20
beelot.security.rate-limit.window-millis=60000
beelot.limits.max-bot-games=5000
beelot.limits.max-private-tables=2000
beelot.limits.idle-expiry=PT2H

# Matchmaking (see MatchmakingService): bots take the empty seats of a public table after this wait.
beelot.matchmaking.bot-fill-wait=PT60S
beelot.matchmaking.sweep-interval=PT5S

# Accounts and match history: MariaDB, migrated by Flyway. `docker compose up -d` starts a local database with these
# defaults. Times are stored in UTC.
spring.datasource.url=${BEELOT_DATABASE_URL:jdbc:mariadb://localhost:3306/beelot}
spring.datasource.username=${BEELOT_DATABASE_USERNAME:beelot}
spring.datasource.password=${BEELOT_DATABASE_PASSWORD:beelot}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# Sign-in with Google and GitHub (US-075, ADR-004): each provider is offered once its client id and secret are set,
# in SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_{GOOGLE,GITHUB}_CLIENT_{ID,SECRET} or in a git-ignored .env imported
# below.
spring.config.import=optional:file:.env[.properties]
# Google is asked for the user id only; GitHub is asked for no scope (see SecurityConfiguration).
spring.security.oauth2.client.registration.google.scope=openid
# Statistics load a player's matches with their seats and rounds in batches rather than one query per match.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
